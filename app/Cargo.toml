[package]
name = "jpmf"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Just Prompt, Motherfucker manifesto. The whole website is this binary."

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
